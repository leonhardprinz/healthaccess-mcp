[workspace]
resolver = "2"
members = ["core", "mcp", "cli"]

[workspace.package]
version = "0.6.2"
edition = "2021"
# MSRV = current stable at the time of writing (rustc 1.99).
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/leonhardprinz/healthaccess-mcp"
homepage = "https://github.com/leonhardprinz/healthaccess-mcp"
authors = ["Leonhard Prinz"]
# crates.io allows at most five keywords of at most 20 characters each.
keywords = ["mcp", "apple-health", "healthkit", "apple-watch", "workout"]

[workspace.dependencies]
healthaccess-core = { path = "core", version = "0.6.2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
thiserror = "2.0"
anyhow = "1.0"
toml = "1.1"
dirs = "7.0"
uuid = { version = "1.29", features = ["v4"] }
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "io-std", "sync"] }
schemars = "1.2"
tempfile = "3.27"
rmcp = { version = "=3.7.0", default-features = false, features = ["server", "macros", "transport-io"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# `cargo clippy --workspace --all-targets -- -D warnings` and
# `RUSTFLAGS=-Dwarnings cargo build --workspace` are the CI gate (see docs/mcp.md).
[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
print_stdout = "allow"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
