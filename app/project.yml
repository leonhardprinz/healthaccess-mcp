name: HealthAccess
options:
  bundleIdPrefix: com.healthaccessmcp
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
packages:
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    exactVersion: 3.92.0
targets:
  HealthAccess:
    type: application
    platform: iOS
    sources:
      - path: HealthAccess
        excludes:
          - "Resources/TelemetryConfig.example.plist"
          - "Resources/CloudConfig.example.plist"
    dependencies:
      - package: PostHog
        product: PostHog
    info:
      path: HealthAccess/Info.plist
      properties:
        CFBundleDisplayName: Health Access
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts: [IBMPlexSansCondensed-SemiBold.ttf, IBMPlexSansCondensed-Bold.ttf]
        NSHealthShareUsageDescription: Health Access writes the Health data you allow into a folder you choose, as files for your AI or coach. Everything is optional, and nothing goes to us.
        NSHealthUpdateUsageDescription: Health Access never writes to Health. It only reads the data you allow. Workout plans go to your Apple Watch through WorkoutKit.
        UIBackgroundModes: [fetch, processing]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Health Access reaches a server in your own network only when you connect one in Settings. It then uploads a copy of your folder to that server.
        BGTaskSchedulerPermittedIdentifiers: [com.healthaccessmcp.app.export, com.healthaccessmcp.app.cloud]
    entitlements:
      path: HealthAccess/HealthAccess.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_NAME: Health Access
        PRODUCT_BUNDLE_IDENTIFIER: com.healthaccessmcp.app
        PRODUCT_MODULE_NAME: HealthAccess
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 72995T7U66
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "38"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: targeted
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  HealthAccessTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HealthAccessTests
    dependencies:
      - target: HealthAccess
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.healthaccessmcp.app.tests
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: 72995T7U66
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Health Access.app/Health Access"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  HealthAccess:
    build:
      targets:
        HealthAccess: all
        HealthAccessTests: [test]
    run:
      config: Debug
      storeKitConfiguration: StoreKit/HealthAccess.storekit
    test:
      config: Debug
      targets:
        - HealthAccessTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
